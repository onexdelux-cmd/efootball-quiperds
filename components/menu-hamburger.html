<script>
// Menu toggle functionality
const hamburgerBtn = document.getElementById('hamburgerBtn');
const mobileMenu = document.getElementById('mobileMenu');

hamburgerBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
});

// Close menu when clicking outside
document.addEventListener('click', (e) => {
    if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
        mobileMenu.classList.add('hidden');
    }
});

// Check auth status and show appropriate menu
async function checkAuthForMenu() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if (session) {
        document.getElementById('guestMenu').classList.add('hidden');
        document.getElementById('userMenu').classList.remove('hidden');
        
        // Load user info
        const { data: profile } = await supabase
            .from('profiles')
            .select('username')
            .eq('id', session.user.id)
            .maybeSingle();
        
        if (profile) {
            document.getElementById('menuUsername').textContent = profile.username;
        }
        
        // Check if admin
        const { data: isAdmin } = await supabase
            .from('admin_users')
            .select('*')
            .eq('id', session.user.id)
            .maybeSingle();
        
        if (isAdmin) {
            document.getElementById('adminLink').classList.remove('hidden');
        }
        
        // Load notification count
        const { data: notifications } = await supabase
            .from('notifications')
            .select('id')
            .eq('user_id', session.user.id)
            .eq('is_read', false);
        
        if (notifications && notifications.length > 0) {
            const badge = document.getElementById('notificationBadge');
            badge.textContent = notifications.length;
            badge.classList.remove('hidden');
        }
    } else {
        document.getElementById('guestMenu').classList.remove('hidden');
        document.getElementById('userMenu').classList.add('hidden');
    }
}

// Logout functionality
document.getElementById('logoutBtn')?.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
});

// Initialize menu on load
document.addEventListener('DOMContentLoaded', checkAuthForMenu);
</script>
